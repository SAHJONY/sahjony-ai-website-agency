<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Owner Back-Office · SAHJONY</title>
<style>
  :root{
    --accent:#e8c476;
    --bg:#08090c; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.03);
    --line:rgba(255,255,255,.09); --ink:#f2f0f6; --muted:#8b8896; --muted2:#5f5d6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:
    radial-gradient(900px 500px at 82% -8%, color-mix(in srgb,var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(700px 500px at -5% 5%, rgba(80,90,140,.10), transparent 55%),
    var(--bg);}
  a{color:inherit}
  /* ---- cinematic backdrop (Higgsfield) ---- */
  .bgfx{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;pointer-events:none;filter:saturate(1.05)}
  .bgfx.on{opacity:.42}
  .bgfx-veil{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;
    background:linear-gradient(180deg,rgba(8,9,12,.62),rgba(8,9,12,.9) 70%,rgba(8,9,12,.97)),
      radial-gradient(1100px 700px at 82% -12%, transparent, rgba(8,9,12,.55))}
  .bgfx-veil.on{display:block}
  .wrap{position:relative;z-index:1;display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  aside,main{position:relative;z-index:1}
  /* ---- sidebar ---- */
  aside{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
  .brand{font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--muted);text-transform:uppercase}
  .biz{font-size:20px;font-weight:800;margin:8px 0 2px;line-height:1.15}
  .vert{font-size:12.5px;color:var(--accent);font-weight:700}
  .navlist{margin-top:26px;display:flex;flex-direction:column;gap:4px}
  .navitem{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border:1px solid transparent;transition:.15s}
  .navitem:hover{color:var(--ink);background:var(--panel2)}
  .navitem.on{color:var(--ink);background:color-mix(in srgb,var(--accent) 13%, transparent);border-color:color-mix(in srgb,var(--accent) 30%, transparent)}
  .navitem .ic{font-size:16px}
  .side-foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted2);line-height:1.6}
  .side-foot a{color:var(--muted);text-decoration:none;font-weight:600}
  .side-foot a:hover{color:var(--accent)}
  /* ---- main ---- */
  main{padding:34px 40px 80px;max-width:1240px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .head h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.01em}
  .head .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:color-mix(in srgb,var(--accent) 45%, transparent)}
  .btn.primary{background:var(--accent);color:#0a0a0a;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08)}
  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px 18px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:.85}
  .kpi .lab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
  /* table */
  .panel{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .ptop{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .ptop h2{font-size:16px;margin:0;font-weight:700}
  .tblscroll{overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
  th{text-align:left;padding:11px 14px;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.015)}
  td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td input,td select{width:100%;min-width:90px;background:transparent;border:1px solid transparent;color:var(--ink);font:inherit;font-size:13.5px;padding:7px 8px;border-radius:8px;transition:.12s}
  td input:hover,td select:hover{border-color:var(--line)}
  td input:focus,td select:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 55%, transparent);background:rgba(255,255,255,.04)}
  td select option{background:#14151a;color:var(--ink)}
  .chipwrap{position:relative}
  .chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid transparent}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
  td select.status{font-weight:700;border:1px solid var(--line)}
  .rowdel{background:transparent;border:none;color:var(--muted2);cursor:pointer;font-size:15px;padding:6px 8px;border-radius:8px;line-height:1}
  .rowdel:hover{color:#ff6b6b;background:rgba(255,107,107,.1)}
  .pbot{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-top:1px solid var(--line)}
  .savenote{font-size:12px;color:var(--muted2);font-weight:600}
  .savenote.ok{color:var(--accent)}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  /* unlock overlay */
  .overlay{position:fixed;inset:0;background:rgba(4,5,8,.86);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:50}
  .lock{background:#101116;border:1px solid var(--line);border-radius:18px;padding:32px 30px;width:min(400px,92vw);text-align:center}
  .lock h3{margin:0 0 6px;font-size:20px}
  .lock p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .lock input{width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--line);background:#0a0b0e;color:var(--ink);font-size:15px;margin-bottom:12px}
  .lock .err{color:#ff6b6b;font-size:13px;min-height:18px;margin-bottom:6px}
  @media(max-width:820px){
    .wrap{grid-template-columns:1fr}
    aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .navlist{flex-direction:row;flex-wrap:wrap}
    main{padding:24px 18px 70px}
  }
</style>
</head>
<body>
<div class="bgfx" id="bgfx"></div>
<div class="bgfx-veil" id="bgfxVeil"></div>
<div class="wrap">
  <aside>
    <div class="brand">SAHJONY · Back-Office</div>
    <div class="biz" id="bizName">Business</div>
    <div class="vert" id="vertName">—</div>
    <nav class="navlist" id="nav"></nav>
    <div class="side-foot">
      Live operational data — synced to your private store.<br>
      <a href="/builder.html">← Site Builder</a> · <a href="#" id="lockLink">Lock</a>
    </div>
  </aside>
  <main>
    <div class="head">
      <div>
        <h1 id="modTitle">Loading…</h1>
        <div class="sub" id="modSub"></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="fxBtn" title="Generate a cinematic FrontDeskOS backdrop for this module">✨ Backdrop</button>
        <button class="btn primary" id="addBtn">+ Add row</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="panel">
      <div class="tblscroll"><table id="tbl"><thead></thead><tbody></tbody></table></div>
      <div class="pbot">
        <span class="savenote" id="saveNote">Ready</span>
        <button class="btn" id="addBtn2">+ Add row</button>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="lockOverlay" style="display:none">
  <div class="lock">
    <h3>Owner sign-in</h3>
    <p>This back-office is private. Enter your dashboard password.</p>
    <div class="err" id="lockErr"></div>
    <input type="password" id="lockPw" placeholder="Password" autocomplete="current-password">
    <button class="btn primary" id="lockBtn" style="width:100%">Unlock</button>
  </div>
</div>

<script type="module">
import { VERTICALS, getVertical } from "/verticals.js";

// ---------- params ----------
const qs = new URLSearchParams(location.search);
const bizName = (qs.get("biz") || "Your Business").slice(0, 80);
const vertId  = qs.get("vertical") || "general";
const vertical = getVertical(vertId);
function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "biz"; }
const slug = (qs.get("slug") || slugify(bizName));

// ---------- theme + chrome ----------
document.documentElement.style.setProperty("--accent", vertical.accent);
document.getElementById("bizName").textContent = bizName;
document.getElementById("vertName").textContent = vertical.label;
document.title = bizName + " · Back-Office";

// ---------- auth (mirrors dashboard.html: token === password, header x-admin-token) ----------
function token(){ return sessionStorage.getItem("fda_admin") || ""; }
function setToken(t){ if(t) sessionStorage.setItem("fda_admin", t); else sessionStorage.removeItem("fda_admin"); }
function authHeaders(extra){ const h = Object.assign({}, extra||{}); const t=token(); if(t) h["x-admin-token"]=t; return h; }

const overlay = document.getElementById("lockOverlay");
function showLock(msg){ overlay.style.display="flex"; if(msg) document.getElementById("lockErr").textContent=msg; document.getElementById("lockPw").focus(); }
function hideLock(){ overlay.style.display="none"; document.getElementById("lockErr").textContent=""; }
document.getElementById("lockBtn").onclick = doUnlock;
document.getElementById("lockPw").addEventListener("keydown", e=>{ if(e.key==="Enter") doUnlock(); });
document.getElementById("lockLink").onclick = e=>{ e.preventDefault(); setToken(""); showLock(); };
async function doUnlock(){
  const pw = document.getElementById("lockPw").value;
  document.getElementById("lockErr").textContent="";
  try{
    const r = await fetch("/api/data?action=login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw})});
    const j = await r.json();
    if(!r.ok || !j.ok){ document.getElementById("lockErr").textContent = j.error || "Wrong password"; return; }
    setToken(pw); hideLock(); await loadVisuals(); loadModule(current.id);
  }catch(e){ document.getElementById("lockErr").textContent = "Network error — try again."; }
}

// ---------- storage ----------
const keyFor = (modId)=> `fda:bo:${slug}:${modId}`;
async function loadRows(modId){
  const r = await fetch("/api/data?key="+encodeURIComponent(keyFor(modId)), { headers: authHeaders() });
  if(r.status===401){ showLock("Sign in to load your data."); throw new Error("auth"); }
  const j = await r.json();
  const v = j && j.value;
  return Array.isArray(v) ? v : (v && Array.isArray(v.rows) ? v.rows : []);
}
async function saveRows(modId, rows){
  const r = await fetch("/api/data?key="+encodeURIComponent(keyFor(modId)),{
    method:"POST", headers: authHeaders({"content-type":"application/json"}), body: JSON.stringify(rows)
  });
  if(r.status===401){ showLock("Session expired — sign in again."); throw new Error("auth"); }
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||("save failed "+r.status)); }
}

// ---------- cinematic backdrops (Higgsfield via /api/image) ----------
// URLs are cached in Upstash so a module's backdrop is generated ONCE, then
// reused on every load — no repeated credit burn. Key: fda:bo:<slug>:_visuals
let visuals = {};
const bgfx = document.getElementById("bgfx");
const bgfxVeil = document.getElementById("bgfxVeil");
async function loadVisuals(){
  try{
    const r = await fetch("/api/data?key="+encodeURIComponent(`fda:bo:${slug}:_visuals`), { headers: authHeaders() });
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.value && typeof j.value==="object") visuals = j.value;
  }catch(_){}
}
async function saveVisuals(){
  try{
    await fetch("/api/data?key="+encodeURIComponent(`fda:bo:${slug}:_visuals`),{
      method:"POST", headers: authHeaders({"content-type":"application/json"}), body: JSON.stringify(visuals)
    });
  }catch(_){}
}
function applyBackdrop(modId){
  const url = visuals[modId];
  if(url){ bgfx.style.backgroundImage = `url("${url}")`; bgfx.classList.add("on"); bgfxVeil.classList.add("on"); }
  else{ bgfx.classList.remove("on"); bgfxVeil.classList.remove("on"); bgfx.style.backgroundImage=""; }
}
// hue → rough color word so the LIGHTING field names the accent the UI actually uses.
function accentWord(hex){
  let h=String(hex||"").replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
  const n=parseInt(h,16); if(isNaN(n)) return "electric cyan";
  const r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let hue=0;
  if(d){ if(mx===r) hue=((g-b)/d)%6; else if(mx===g) hue=(b-r)/d+2; else hue=(r-g)/d+4; hue*=60; if(hue<0)hue+=360; }
  if(hue<20||hue>=330) return "crimson";
  if(hue<45) return "amber-orange"; if(hue<70) return "luminescent gold";
  if(hue<160) return "emerald-mint"; if(hue<200) return "cyber-cyan";
  if(hue<255) return "electric blue"; if(hue<290) return "violet"; return "magenta";
}
// AGENTS.md §5 five-field prompt block, specialized per module.
function backdropPrompt(){
  const v=vertical, m=current;
  return [
    "MODEL: Soul V2 photoreal cinematic still",
    "COMPOSITION: Cinematic ultra-wide hero, balanced dark-room framing, generous negative space, subject weighted to the right third",
    `SUBJECT: Ultra-premium ${v.blurb} operations environment for a ${v.label}, evoking the "${m.title}" workflow — sleek futuristic control surfaces with fluid glowing line charts and translucent glass data panels, fully abstract with NO readable text`,
    `LIGHTING: Obsidian-vacuum deep contrast on a near-black background, sharp luminescent ${accentWord(v.accent)} rim lighting, soft volumetric haze`,
    "AESTHETIC: Tesla/Apple flagship high-end luxury digital asset, 8k, photorealistic, color-graded, no text, no UI chrome, no watermark, no logo"
  ].join("\n");
}
async function generateBackdrop(){
  const btn=document.getElementById("fxBtn"); const modId=current.id; const old=btn.textContent;
  btn.disabled=true; btn.textContent="✨ Painting…";
  try{
    const r=await fetch("/api/image",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt:backdropPrompt(), size:"1536x1024"})});
    const j=await r.json();
    if(!r.ok || !j.url){ btn.textContent="⚠ "+String(j.error||("engine "+r.status)).slice(0,40); setTimeout(()=>{btn.textContent=old;btn.disabled=false;},4000); return; }
    visuals[modId]=j.url; saveVisuals();
    if(current.id===modId) applyBackdrop(modId);
    btn.textContent="✓ Backdrop"; setTimeout(()=>{btn.textContent=old;btn.disabled=false;},2500);
  }catch(e){ btn.textContent="⚠ Network"; setTimeout(()=>{btn.textContent=old;btn.disabled=false;},3000); }
}
document.getElementById("fxBtn").onclick = generateBackdrop;

// ---------- helpers ----------
const money = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
function fmtMoney(n){ const x=Number(n); return isFinite(x)?money.format(x):"$0"; }
// deterministic color per status label (stable across reloads, no Math.random)
const STATUS_HUES=[145,205,45,275,15,175,320,95];
function hueFor(mod, label){
  const list = mod.statuses || [];
  let i = list.indexOf(label); if(i<0){ let h=0; for(const c of String(label)) h=(h*31+c.charCodeAt(0))>>>0; i=h; }
  return STATUS_HUES[i % STATUS_HUES.length];
}

// ---------- state ----------
let current = vertical.modules[0];
let rows = [];
let saveTimer = null;

// ---------- nav ----------
const nav = document.getElementById("nav");
vertical.modules.forEach(m=>{
  const el = document.createElement("div");
  el.className = "navitem" + (m.id===current.id?" on":"");
  el.dataset.id = m.id;
  el.innerHTML = `<span class="ic">${m.icon||"▪"}</span><span>${m.title}</span>`;
  el.onclick = ()=> loadModule(m.id);
  nav.appendChild(el);
});
function markNav(id){ nav.querySelectorAll(".navitem").forEach(n=> n.classList.toggle("on", n.dataset.id===id)); }

// ---------- KPIs ----------
function computeKpi(k){
  if(k.agg==="count") return String(rows.length);
  if(k.agg==="countStatus"){ const f=current.statusField; return String(rows.filter(r=>r[f]===k.value).length); }
  if(k.agg==="sum"){ return fmtMoney(rows.reduce((a,r)=>a+(Number(r[k.field])||0),0)); }
  if(k.agg==="sumProduct"){ return fmtMoney(rows.reduce((a,r)=>a+(Number(r[k.field])||0)*(Number(r[k.field2])||0),0)); }
  return "—";
}
function renderKpis(){
  const wrap = document.getElementById("kpis"); wrap.innerHTML="";
  (current.kpis||[]).forEach(k=>{
    const el=document.createElement("div"); el.className="kpi";
    el.innerHTML = `<div class="lab">${k.label}</div><div class="val">${computeKpi(k)}</div>`;
    wrap.appendChild(el);
  });
}

// ---------- table ----------
function renderTable(){
  const thead = document.querySelector("#tbl thead");
  const tbody = document.querySelector("#tbl tbody");
  thead.innerHTML = "<tr>" + current.columns.map(c=>`<th>${c.label}</th>`).join("") + "<th></th></tr>";
  tbody.innerHTML = "";
  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="${current.columns.length+1}"><div class="empty">No records yet. Click <b>+ Add row</b> to start.</div></td></tr>`;
    return;
  }
  rows.forEach((row, idx)=>{
    const tr=document.createElement("tr");
    current.columns.forEach(col=>{
      const td=document.createElement("td");
      td.appendChild(cellInput(col, row, idx));
      tr.appendChild(td);
    });
    const tdDel=document.createElement("td");
    const del=document.createElement("button"); del.className="rowdel"; del.title="Delete"; del.textContent="✕";
    del.onclick=()=>{ rows.splice(idx,1); renderAll(); scheduleSave(); };
    tdDel.appendChild(del); tr.appendChild(tdDel);
    tbody.appendChild(tr);
  });
}
function cellInput(col, row, idx){
  const val = row[col.key] != null ? row[col.key] : "";
  let el;
  if(col.type==="status" || col.type==="select"){
    el=document.createElement("select");
    const opts = col.type==="status" ? (current.statuses||[]) : ((current.options&&current.options[col.key])||[]);
    el.innerHTML = `<option value="">—</option>` + opts.map(o=>`<option${o===val?" selected":""}>${o}</option>`).join("");
    if(col.type==="status"){ el.className="status"; styleStatus(el); el.addEventListener("change",()=>styleStatus(el)); }
  } else {
    el=document.createElement("input");
    el.type = col.type==="money"||col.type==="num" ? "number" : (col.type==="date"?"date":"text");
    if(col.type==="money") el.step="0.01";
    el.value = val;
    if(col.type==="date"&&val) el.value = String(val).slice(0,10);
  }
  el.addEventListener("change", ()=>{
    let v = el.value;
    if(col.type==="money"||col.type==="num") v = v===""? "" : Number(v);
    rows[idx][col.key]=v; renderKpis(); scheduleSave();
  });
  return el;
}
function styleStatus(sel){
  const label=sel.value; const mod=current;
  if(!label){ sel.style.color=""; sel.style.borderColor=""; sel.style.background=""; return; }
  const h=hueFor(mod,label);
  sel.style.color = `hsl(${h} 70% 72%)`;
  sel.style.borderColor = `hsl(${h} 60% 45% / .5)`;
  sel.style.background = `hsl(${h} 60% 50% / .12)`;
}

// ---------- save ----------
function scheduleSave(){
  const note=document.getElementById("saveNote"); note.textContent="Saving…"; note.className="savenote";
  clearTimeout(saveTimer);
  const modId = current.id;
  saveTimer = setTimeout(async ()=>{
    try{ await saveRows(modId, rows); note.textContent="✓ Saved"; note.className="savenote ok"; }
    catch(e){ if(e.message!=="auth"){ note.textContent="⚠ "+e.message; note.className="savenote"; } }
  }, 500);
}

// ---------- render + load ----------
function renderAll(){
  document.getElementById("modTitle").textContent = current.icon+" "+current.title;
  document.getElementById("modSub").textContent = vertical.label + " · " + (rows.length) + " record" + (rows.length===1?"":"s");
  renderKpis(); renderTable();
}
async function loadModule(id){
  current = vertical.modules.find(m=>m.id===id) || vertical.modules[0];
  markNav(current.id);
  applyBackdrop(current.id);
  document.getElementById("saveNote").textContent="Loading…";
  document.getElementById("saveNote").className="savenote";
  try{
    rows = await loadRows(current.id);
    renderAll();
    document.getElementById("saveNote").textContent="Ready";
  }catch(e){ if(e.message!=="auth"){ rows=[]; renderAll(); document.getElementById("saveNote").textContent="⚠ "+e.message; } }
}
function addRow(){
  const blank={}; current.columns.forEach(c=> blank[c.key]="");
  // sensible defaults: first status → first option
  if(current.statusField && current.statuses) blank[current.statusField]=current.statuses[0];
  rows.push(blank); renderAll(); scheduleSave();
  // focus the first input of the new row
  const tb=document.querySelector("#tbl tbody"); const last=tb.lastElementChild; const f=last&&last.querySelector("input,select"); if(f) f.focus();
}
document.getElementById("addBtn").onclick = addRow;
document.getElementById("addBtn2").onclick = addRow;

// ---------- go ----------
(async ()=>{ await loadVisuals(); loadModule(current.id); })();
</script>
</body>
</html>
